name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        default: false
        type: boolean
      release_module:
        description: Rehearse one module directory; blank selects all
        required: false
        default: ''
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@aa730a67fb33b378889bda98497e406ed02c793a # qualified source tooling
    with:
      tooling_sha: aa730a67fb33b378889bda98497e406ed02c793a
      source_bootstrap: true
      public_dependencies: true
      release_dry_run: ${{ inputs.release_dry_run || false }}
      release_module: ${{ inputs.release_module || '' }}

  allocation-admission-386:
    name: Scalar allocation admission (386)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Execute finite 32-bit allocation admission
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/knapsack-scalar-386.XXXXXX")"
          trap 'chmod -R u+w "${task}"; find "${task}" -depth -delete; test ! -e "${task}"' EXIT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" \
            GOARCH=386 CGO_ENABLED=0 GOMAXPROCS=2 GOWORK=off \
            go test -p=1 ./solver \
              -run '^TestExact(LatticeScalarAdmission|CartesianScalarAdmission)$' \
              -count=1 -timeout=30s

  required:
    name: Required
    if: always()
    needs: [ci, allocation-admission-386]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow
        env:
          CI_RESULT: ${{ needs.ci.result }}
          ALLOCATION_RESULT: ${{ needs.allocation-admission-386.result }}
        run: |
          test "${CI_RESULT}" = success
          test "${ALLOCATION_RESULT}" = success
