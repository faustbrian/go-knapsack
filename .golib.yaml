schema_version: 1
tool_version: v2.4.0
tool_checksums_sha256: 875e5592e9fbea713c492d9e6979202e1d6bf687f52f55654e3e72c192963273

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
    - module: objective/gomoney
      archive: .verification/mutation/bootstrap/objective-gomoney.zip
      ledger: .verification/mutation/migration-ledger.json

# Native coverage still collects the complete root profile; the mandatory
# package-test operation owns the narrowly source-bound release exception.
coverage:
  modules:
    - module: .
      mode: evidence

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt
    - module: objective/gomoney
      mode: apidiff
      path: objective/gomoney/api/v2.txt
    - module: objective/money
      mode: apidiff
      path: objective/money/api/v3.txt

operations:
  # Cancellation must return from both solvers without retaining work.
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: [./solver]
        run: '^TestSolversStopAfterRepeatedCancellation$'
        race: true
        count: 1
        timeout: 2m
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: package-test
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzItemContainerValidation$'
        budget: 250000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzLatticeNormalization$'
        budget: 250000x
        timeout: 20m
      - type: go-test
        packages: [./encoding]
        fuzz: '^FuzzPlanDecode$'
        budget: 75000x
        timeout: 20m
      - type: go-test
        packages: [./encoding]
        fuzz: '^FuzzRequestDecode$'
        budget: 40000x
        timeout: 20m
      - type: go-test
        packages: [./geometry]
        fuzz: '^FuzzGeometry$'
        budget: 250000x
        timeout: 20m
      - type: go-test
        packages: [./geometry]
        fuzz: '^FuzzOrientationEnumeration$'
        budget: 250000x
        timeout: 20m
      - type: go-test
        packages: [./geometry]
        fuzz: '^FuzzCuboidRelations$'
        budget: 250000x
        timeout: 20m
      - type: go-test
        packages: [./objective]
        fuzz: '^FuzzObjectiveComparison$'
        budget: 150000x
        timeout: 20m
      - type: go-test
        packages: [./solver]
        fuzz: '^FuzzHeuristic$'
        budget: 100000x
        timeout: 20m
      - type: go-test
        packages: [./solver]
        fuzz: '^FuzzFixedContainerPacking$'
        budget: 100000x
        timeout: 20m
      - type: go-test
        packages: [./solver]
        fuzz: '^FuzzVariableContainerSelection$'
        budget: 100000x
        timeout: 20m
      - type: go-test
        packages: [./solver]
        fuzz: '^FuzzExactTinyAgreement$'
        budget: 5000x
        timeout: 20m
      - type: go-test
        packages: [./solver]
        fuzz: '^FuzzCancellationAndBudgets$'
        budget: 50000x
        timeout: 20m
      - type: go-test
        packages: [./verify]
        fuzz: '^FuzzSuppliedPlan$'
        budget: 75000x
        timeout: 20m
      - type: go-test
        packages: [./verify]
        fuzz: '^FuzzPhysicalConstraints$'
        budget: 75000x
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: make
        makefile: verification/package.mk
        target: benchmark
        timeout: 60m
  - module: objective/gomoney
    gate: docs
    steps:
      - type: make
        makefile: Makefile
        target: docs
        timeout: 20m
  - module: objective/gomoney
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzCostTypeIdentifiers$'
        budget: 150000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzCostMappings$'
        budget: 150000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzSolverCostObjective$'
        budget: 150000x
        timeout: 20m
  - module: objective/gomoney
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: objective/money
    gate: docs
    steps:
      - type: make
        makefile: Makefile
        target: docs
        timeout: 20m
  - module: objective/money
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzCostTypeIdentifiers$'
        budget: 150000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzCostMappings$'
        budget: 150000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzSolverCostObjective$'
        budget: 150000x
        timeout: 20m
  - module: objective/money
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
