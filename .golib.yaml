schema_version: 1
tool_version: v1.4.0
tool_checksums_sha256: ba1b71d41dc9b58d5bfb411bc89ae2d45b6f3f778152714bfd1afeab0bef2f33
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
api:
  baselines:
  - module: "."
    mode: apidiff
    path: api/baseline.txt
  - module: objective/gomoney
    mode: apidiff
    path: objective/gomoney/api/baseline.txt
operations:
- module: "."
  gate: test
  steps:
  - type: make
    makefile: .golib/package.mk
    target: api
    timeout: 20m
- module: "."
  gate: fuzz
  steps:
  - type: make
    makefile: .golib/package.mk
    target: fuzz
    timeout: 20m
- module: "."
  gate: benchmark
  steps:
  - type: make
    makefile: .golib/package.mk
    target: benchmark
    timeout: 20m
- module: objective/gomoney
  gate: test
  steps:
  - type: go-test
    packages:
    - "."
    timeout: 20m
- module: objective/gomoney
  gate: fuzz
  steps:
  - type: go-test
    packages:
    - "."
    fuzz: '^Fuzz'
    budget: 100x
    timeout: 20m
- module: objective/gomoney
  gate: benchmark
  steps:
  - type: go-test
    packages:
    - "."
    benchmark: "."
    budget: 100ms
    timeout: 20m
